[package]
name = "scrfd-hrx"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "SCRFD face detection in Rust for AMD GPUs."
repository = "https://github.com/zacharydenton/scrfd-hrx"
include = ["src/**", "kernels/**", "tests/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[dependencies]
hrx = { package = "hrx-rs", version = "0.8.2" }
anyhow = "1"
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[[bench]]
name = "detect"
harness = false

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
fast_image_resize = "=5.1.4"
tempfile = "3"
matrixmultiply = "0.3"
onnx-protobuf = "0.2.3"
# Test fixtures use the generated ONNX protobuf API directly.
protobuf = "=3.4.0"
